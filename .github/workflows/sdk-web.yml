name: sdk-web

on:
  push:
    paths: ['artracker-web-sdk/**']
  pull_request:
    paths: ['artracker-web-sdk/**']

defaults:
  run:
    working-directory: artracker-web-sdk

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: artracker-web-sdk/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: pnpm size
